[package]
name = "wtrash"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Native Windows Recycle Bin listing CLI"

[dependencies]
clap = { version = "~4.5", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
